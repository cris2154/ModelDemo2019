<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
	<defs>
		<linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#FDE68A" />
			<stop offset="30%" stop-color="#F59E0B" />
			<stop offset="70%" stop-color="#D97706" />
			<stop offset="100%" stop-color="#92400E" />
		</linearGradient>
		<linearGradient id="amber-core" x1="0%" y1="100%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#F97316" />
			<stop offset="50%" stop-color="#FBBF24" />
			<stop offset="100%" stop-color="#FFFFFF" />
		</linearGradient>
		<linearGradient id="metal-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
			<stop offset="50%" stop-color="#F59E0B" stop-opacity="0.2" />
			<stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="4" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>

	<!-- Símbolo Isotipo: Prisma Hexagonal de Hardware de Titanio & Núcleo Nova -->
	<g transform="translate(10, 10)">
		<!-- Resplandor ambiental suave -->
		<circle cx="50" cy="50" r="42" fill="#F59E0B" opacity="0.15" filter="url(#glow)" />
		
		<!-- Escudo externo hexagonal -->
		<polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
			stroke="url(#gold-grad)" stroke-width="3" fill="#0C0D12" fill-opacity="0.9" />
		
		<!-- Bisel interior metálico -->
		<polygon points="50,14 80,31 80,69 50,86 20,69 20,31" 
			stroke="url(#metal-sheen)" stroke-width="1.5" fill="none" opacity="0.6" />

		<!-- Núcleo Nova / Rayo Cuántico -->
		<path d="M54,20 L32,54 L48,54 L42,80 L68,46 L52,46 Z" 
			fill="url(#amber-core)" filter="url(#glow)" />

		<!-- Micro-puntos de circuito de calibración -->
		<circle cx="50" cy="6" r="2.5" fill="#FDE68A" />
		<circle cx="88" cy="28" r="2.5" fill="#FDE68A" />
		<circle cx="88" cy="72" r="2.5" fill="#FDE68A" />
		<circle cx="50" cy="94" r="2.5" fill="#FDE68A" />
		<circle cx="12" cy="72" r="2.5" fill="#FDE68A" />
		<circle cx="12" cy="28" r="2.5" fill="#FDE68A" />
	</g>

	<!-- Logotipo Tipográfico: ELECTRO NOVA -->
	<g transform="translate(130, 36)">
		<!-- Texto Principal: ELECTRO -->
		<text x="0" y="32" 
			font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
			font-weight="900" 
			font-size="34" 
			letter-spacing="1.5" 
			fill="#FFFFFF">
			ELECTRO
		</text>

		<!-- Texto Principal: NOVA con gradiente Oro/Ámbar -->
		<text x="172" y="32" 
			font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
			font-weight="900" 
			font-size="34" 
			letter-spacing="1.5" 
			fill="url(#gold-grad)">
			NOVA
		</text>

		<!-- Subtítulo de Marca Registrada: HARDWARE LABORATORIES -->
		<text x="2" y="54" 
			font-family="'JetBrains Mono', monospace" 
			font-weight="700" 
			font-size="9.5" 
			letter-spacing="4" 
			fill="#F59E0B" 
			opacity="0.9">
			HARDWARE LABORATORIES • EST. 2021
		</text>
	</g>
</svg>
